apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctfd
spec:
  tls:
    - hosts: [quest.example.com]
      secretName: ctfd-tls
  rules:
    - host: quest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ctfd
                port:
                  name: http
