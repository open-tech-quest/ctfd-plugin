# Only the OpenShift ingress router reaches the web server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctfd-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ctfd
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8000
