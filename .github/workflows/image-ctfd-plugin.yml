name: image ctfd-plugin

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - examples/**
      - .dockerignore
      - plugin/**
      - web/**
      - branding/**
      - tests/**
      - scripts/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write

concurrency:
  group: image-ctfd-plugin-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: quality
    uses: ./.github/workflows/build-image.yml
    with:
      image: ctfd-plugin
      context: .
      tag_prefix: v
      test_target: test
      bump: ${{ inputs.bump || 'patch' }}
      push: ${{ github.event_name != 'pull_request' }}

  automerge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Merge patch / digest-only bumps and publish
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' && (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            contains(github.event.pull_request.head.ref, '/patches-') ||
            (steps.meta.outputs.dependency-names == 'node' &&
             steps.meta.outputs.update-type == 'version-update:semver-minor') || (
              steps.meta.outputs.package-ecosystem == 'docker' &&
              steps.meta.outputs.new-version != '' &&
              steps.meta.outputs.previous-version == steps.meta.outputs.new-version))
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR" --squash --delete-branch
          gh workflow run image-ctfd-plugin.yml --ref "${{ github.event.repository.default_branch }}" -R "$GITHUB_REPOSITORY"
