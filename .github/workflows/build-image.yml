# Build and publish the same release commit used by tagged deployment manifests.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Package name, published under the lowercase repository owner
        type: string
        required: true
      context:
        description: Build context directory
        type: string
        required: true
      file:
        description: Dockerfile path (default <context>/Dockerfile)
        type: string
        default: ""
      tag_prefix:
        description: Prefix for immutable semantic-version Git tags
        type: string
        default: v
      bump:
        description: patch, minor or major
        type: string
        default: patch
      push:
        description: false prepares and tests locally without publication
        type: boolean
        default: false
      release:
        description: Create a GitHub release with the published image metadata
        type: boolean
        default: true
      test_target:
        description: Optional Dockerfile stage that runs the tests; built first
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Next version
        id: v
        env:
          PREFIX: ${{ inputs.tag_prefix }}
          BUMP: ${{ inputs.bump }}
        run: |
          python3 scripts/prepare-release.py --github-output "$GITHUB_OUTPUT" next-version --prefix "$PREFIX" --bump "$BUMP"
          namespace=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'namespace=%s\n' "$namespace" >> "$GITHUB_OUTPUT"

      - name: Prepare release commit
        id: prepared
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: python3 scripts/prepare-release.py --github-output "$GITHUB_OUTPUT" prepare --version "$VERSION" --prefix "$PREFIX"

      - name: Install deployment validation tools
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-deploy.txt
          python3 scripts/install-deploy-tools.py --output "$RUNNER_TEMP/quest-deploy-tools"
          printf '%s\n' "$RUNNER_TEMP/quest-deploy-tools" >> "$GITHUB_PATH"

      - name: Validate prepared deployment manifests
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python3 scripts/validate-deploy.py --release-version "$VERSION"

      - uses: docker/setup-buildx-action@v4

      - name: Tests (${{ inputs.test_target }})
        if: inputs.test_target != ''
        uses: docker/build-push-action@v7
        with:
          # Explicit path context includes the prepared local commit's files.
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.test_target }}
          push: false
          build-args: |
            PLUGIN_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.image }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build${{ inputs.push && ' and push' || '' }} ${{ inputs.image }}:${{ steps.v.outputs.version }}
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ steps.v.outputs.namespace }}/${{ inputs.image }}:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            PLUGIN_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.prepared.outputs.source_commit }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Tag and release
        if: inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ghcr.io/${{ steps.v.outputs.namespace }}/${{ inputs.image }}:${{ steps.v.outputs.version }}
          IMAGE_NAME: ${{ inputs.image }}
          VERSION: ${{ steps.v.outputs.version }}
          PREFIX: ${{ inputs.tag_prefix }}
          TAG: ${{ steps.prepared.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.prepared.outputs.source_commit }}
          SOURCE_PARENT: ${{ steps.prepared.outputs.source_parent }}
          PREVIOUS: ${{ inputs.tag_prefix }}${{ steps.v.outputs.previous }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE: ${{ inputs.release }}
          CONTEXT: ${{ inputs.context }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/prepare-release.py manifest --version "$VERSION" --prefix "$PREFIX" --image "$IMAGE_REF" --digest "$DIGEST" --output "$RUNNER_TEMP/quest-release/release.json"
          git tag -- "$TAG" "$SOURCE_COMMIT"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$RELEASE" = true ]; then
            {
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..$SOURCE_PARENT" -- "$CONTEXT"
              echo
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREVIOUS" "$TAG"
              echo
              printf 'Image: `%s@%s`\n' "$IMAGE_REF" "$DIGEST"
            } > "$RUNNER_TEMP/quest-release/notes.md"
            gh release create "$TAG" "$RUNNER_TEMP/quest-release/release.json" --verify-tag --title "$IMAGE_NAME $VERSION" --notes-file "$RUNNER_TEMP/quest-release/notes.md" --latest=true
          fi
          printf 'Published `%s@%s` from `%s`\n' "$IMAGE_REF" "$DIGEST" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
